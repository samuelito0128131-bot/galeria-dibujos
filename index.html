<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Samu Arts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <img src="hero.png" alt="Samu Arts" class="imagen-hero">
    <div class="contenido-header">
      <h1>¡Aquí guardo mis mejores creaciones!</h1>
      <div class="botones-subir">
        <label for="subirImagen" class="boton-subir">🦖 Subir un dibujo</label>
        <input type="file" id="subirImagen" accept="image/*" multiple hidden>

        <label for="subirHistorieta" class="boton-subir boton-historieta">📖 Subir historieta</label>
        <input type="file" id="subirHistorieta" accept="image/*" multiple hidden>
      </div>
    </div>
  </header>

  <main>
    <div class="galeria" id="galeria">
      <!-- Aquí irán los dibujos e historietas -->
    </div>
  </main>

  <!-- Modal del modo libro -->
  <div id="modalLibro" class="modal-libro oculto">
    <div class="libro-contenedor">
      <button id="cerrarLibro" class="cerrar-libro">✖</button>
      <h2 id="tituloLibro"></h2>
      <img id="paginaActual" src="" alt="Página de la historieta">
      <div class="controles-libro">
        <button id="paginaAnterior">◀</button>
        <span id="contadorPaginas"></span>
        <button id="paginaSiguiente">▶</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>

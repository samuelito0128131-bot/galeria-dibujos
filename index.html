<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Samu Arts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <img src="hero.png" alt="Samu Arts" class="imagen-hero">
    <div class="contenido-header">
      <h1>¡Aquí guardo mis mejores creaciones!</h1>
      <div class="botones-subir">
        <label for="subirImagen" class="boton-subir">🦖 Subir un dibujo</label>
        <input type="file" id="subirImagen" accept="image/*" multiple hidden>

        <label for="subirAnimacion" class="boton-subir boton-animacion">🎬 Subir a Entre Bestias</label>
        <input type="file" id="subirAnimacion" accept="video/*" hidden>
      </div>
    </div>
  </header>

  <main>
    <div class="galeria" id="galeria">
      <!-- Aquí irán los dibujos y animaciones -->
    </div>
  </main>

  <!-- Modal visor de dibujos (modo libro) -->
  <div id="modalVisor" class="modal-libro oculto">
    <div class="libro-contenedor">
      <button id="cerrarVisor" class="cerrar-libro">✖</button>
      <img id="imagenVisor" src="" alt="Dibujo">
      <div class="controles-libro">
        <button id="visorAnterior">◀</button>
        <span id="contadorVisor"></span>
        <button id="visorSiguiente">▶</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>

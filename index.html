<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La Galería de Dibujos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body><div class="decoracion">
    <span class="flotante" style="top: 10%; left: 5%;">✏️</span>
    <span class="flotante" style="top: 20%; right: 8%;">🖌️</span>
    <span class="flotante" style="top: 60%; left: 3%;">⭐</span>
    <span class="flotante" style="top: 70%; right: 5%;">🌈</span>
    <span class="flotante" style="top: 40%; left: 90%;">🎨</span>
  </div>

  <header>
    <h1>🎨 La Galería de Dibujos</h1>
    <p>¡Aquí guardo mis mejores creaciones!</p>
  </header>

  <main>
    <div class="subir-contenedor">
      <label for="subirImagen" class="boton-subir">📤 Subir un dibujo</label>
      <input type="file" id="subirImagen" accept="image/*" multiple hidden>
    </div>

    <div class="galeria" id="galeria">
      <!-- Aquí irán los dibujos -->
    </div>

    <section class="serie-animada">
      <h2>🎬 La Historia de Bruno</h2>

      <div class="escena">
        <div class="burbuja">Bueno, mi nombre es Bruno y esta es mi historia</div>
        <video src="https://firebasestorage.googleapis.com/v0/b/samu-arts.firebasestorage.app/o/bruno-video.mp4?alt=media&token=906c1439-bebc-428a-97dd-f400e34ac4c9" autoplay loop muted playsinline></video>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
